<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Newsreader:opsz,wght@6..72,480;6..72,600&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --walnut: #241c16;
      --limestone: #f4e7d4;
      --ink: #1c140e;
      --clay: #7a624c;
      --tekhelet: #1a4a78;
      --gold: #9a7433;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(1200px 700px at 50% 0%, #3a2e24 0%, transparent 55%),
        var(--walnut);
      color: var(--ink);
      font-family: "Newsreader", "Iowan Old Style", Palatino, serif;
    }

    .sheet {
      width: min(100%, 28rem);
      background: var(--limestone);
      padding: 2.25rem 2rem 1.75rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    .label {
      margin: 0;
      font-family: "Spline Sans Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--tekhelet);
    }

    .time-label {
      margin-top: 1.35rem;
    }

    .hebrew {
      margin: 0.35rem 0 0;
      font-family: "Frank Ruhl Libre", "David Libre", "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 8vw, 3.35rem);
      line-height: 1.25;
      text-align: right;
    }

    .gloss {
      margin: 0.85rem 0 0;
      font-size: 1.2rem;
      font-weight: 480;
      line-height: 1.35;
      color: var(--clay);
    }

    .rule {
      height: 3px;
      margin: 1.6rem 0 1.35rem;
      background: var(--tekhelet);
      border: 0;
    }

    .english {
      margin: 0.3rem 0 0;
      font-size: clamp(1.65rem, 5vw, 2.05rem);
      font-weight: 600;
      line-height: 1.2;
      text-wrap: balance;
    }

    .clock {
      margin: 0.45rem 0 0;
      font-family: "Spline Sans Mono", ui-monospace, monospace;
      font-size: clamp(1.85rem, 6vw, 2.35rem);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      color: var(--gold);
    }

    .note {
      margin: 1.5rem 0 0;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--clay);
    }

    .status {
      margin: 1rem 0 0;
      color: var(--tekhelet);
    }

    .status[hidden] { display: none; }

    a {
      color: var(--tekhelet);
    }

    a:focus-visible,
    :focus-visible {
      outline: 2px solid var(--tekhelet);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <p class="label">Hebrew</p>
    <p class="hebrew" id="hebrew" lang="he" dir="rtl">…</p>
    <p class="gloss" id="gloss">…</p>

    <hr class="rule">

    <p class="label">English</p>
    <p class="english" id="english">…</p>

    <p class="label time-label">Time</p>
    <p class="clock" id="clock" aria-live="off">…</p>

    <p class="note">The Hebrew date follows the civil day. The Jewish day begins at sunset.</p>
    <p class="status" id="status" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@hebcal/core@6/dist/bundle.min.js"></script>
  <script>
    const hebrewEl = document.getElementById("hebrew");
    const glossEl = document.getElementById("gloss");
    const englishEl = document.getElementById("english");
    const clockEl = document.getElementById("clock");
    const statusEl = document.getElementById("status");

    const englishDate = new Intl.DateTimeFormat("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric",
    });
    const clockFormat = new Intl.DateTimeFormat(undefined, {
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit",
    });

    let shownDay = "";

    function renderDates(now) {
      const dayKey = now.toDateString();
      if (dayKey === shownDay) return;
      shownDay = dayKey;

      const hd = new hebcal.HDate(now);
      hebrewEl.textContent = hd.renderGematriya();
      glossEl.textContent = hd.render("en");
      englishEl.textContent = englishDate.format(now);
    }

    function tick() {
      const now = new Date();
      renderDates(now);
      clockEl.textContent = clockFormat.format(now);
      clockEl.dateTime = now.toISOString();
    }

    if (!window.hebcal || typeof hebcal.HDate !== "function") {
      statusEl.hidden = false;
      statusEl.textContent = "The Hebcal library did not load. Check the network connection and reload.";
    } else {
      tick();
      setInterval(tick, 1000);
    }
  </script>
</body>
</html>
